[workspace]
members = ["apps/bigbrotr", "crates/bigbrotr-model", "crates/bigbrotr-protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/BigBrotr/bigbrotr-rs"
publish = false

[workspace.dependencies]
bigbrotr-model = { path = "crates/bigbrotr-model" }
bigbrotr-protocol = { path = "crates/bigbrotr-protocol" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(secp256k1_fuzz)'] }

[profile.release]
lto = "thin"
strip = "debuginfo"
