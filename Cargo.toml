[workspace]
members = ["apps/bigbrotr", "apps/bigbrotr-archive-worker", "crates/bigbrotr-model", "crates/bigbrotr-protocol"]
exclude = ["vendor/libduckdb-sys", "vendor/clickhouse", "vendor/clickhouse-types"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/BigBrotr/bigbrotr-rs"
publish = false

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["service", "tokio", "client-legacy", "http1"] }
tower-service = { version = "=0.3.3", default-features = false }
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
duckdb = { version = "=1.10505.0", default-features = false, features = ["appender-arrow"] }
arrow = { version = "=58.4.0", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
bigbrotr-model = { path = "crates/bigbrotr-model" }
bigbrotr-protocol = { path = "crates/bigbrotr-protocol" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
command-fds = { version = "=0.3.3", default-features = false }
# Already selected by command-fds; tests use its portable, non-spawning FIFO API.
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }
clickhouse = { version = "=0.15.2", default-features = false, features = ["rustls-tls-ring", "rustls-tls-webpki-roots"] }
minicbor = { version = "=2.3.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.27.0"
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse", "display", "serde"] }
url = "=2.5.8"
getrandom = "=0.4.3"
rocksdb = { version = "=0.25.0", default-features = false, features = ["zstd", "bindgen-runtime"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "time", "sync", "signal", "macros", "io-util"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
webpki-roots = { version = "=1.0.10", default-features = false }

# Keep selected versions while correcting ZIP dependency and CH metadata bounds.
# Provenance and the upstream replacement condition are in vendor/README.md.
[patch.crates-io]
libduckdb-sys = { path = "vendor/libduckdb-sys" }
clickhouse = { path = "vendor/clickhouse" }
clickhouse-types = { path = "vendor/clickhouse-types" }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(secp256k1_fuzz)'] }

[profile.release]
lto = "thin"
strip = "debuginfo"
