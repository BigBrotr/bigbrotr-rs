[workspace]
members = ["apps/bigbrotr"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/BigBrotr/bigbrotr-rs"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
