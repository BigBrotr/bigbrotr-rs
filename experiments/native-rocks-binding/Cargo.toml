[package]
name = "native-rocks-binding"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace]

[dependencies]
rocksdb = { version = "=0.25.0", default-features = false, features = ["zstd", "bindgen-runtime"] }

# This experiment is its own workspace: root patches do not propagate here.
[patch.crates-io]
rocksdb = { path = "../../vendor/rocksdb" }
librocksdb-sys = { path = "../../vendor/librocksdb-sys" }
