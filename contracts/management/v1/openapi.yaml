  "components": {
    "schemas": {
      "LoginInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "pattern": "^[a-z0-9._-]{1,64}$"
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 1024,
            "writeOnly": true,
            "description": "Exact password, at most1024 UTF-8 bytes and no control characters. Never trim or normalize."
          }
        }
      },
      "SessionObservation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "format",
          "principal_id",
          "credential_revision",
          "grant_revision",
          "policy_revision",
          "expires_at_us",
          "idle_expires_at_us",
          "stored_actions",
          "authority"
        ],
        "properties": {
          "format": {
            "type": "string",
            "const": "bigbrotr-session/1"
          },
          "principal_id": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$",
            "not": {
              "const": "00000000000000000000000000000000"
            }
          },
          "credential_revision": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "description": "Canonical positive uint64 decimal string; maximum18446744073709551615. Never convert to JavaScript Number."
          },
          "grant_revision": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "description": "Canonical positive uint64 decimal string; maximum18446744073709551615. Never convert to JavaScript Number."
          },
          "policy_revision": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "description": "Canonical positive uint64 decimal string; maximum18446744073709551615. Never convert to JavaScript Number."
          },
          "expires_at_us": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,18}$",
            "description": "Positive Unix microseconds, maximum9223372036854775807. A server observation, not a renewable client-side authority lease."
          },
          "idle_expires_at_us": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,18}$",
            "description": "Positive Unix microseconds, maximum9223372036854775807. A server observation, not a renewable client-side authority lease."
          },
          "stored_actions": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "audit.read",
                "budgets.change",
                "data.read",
                "policy.change",
                "principals.manage",
                "roles.control",
                "status.read"
              ]
            },
            "maxItems": 7,
            "uniqueItems": true
          },
          "authority": {
            "type": "string",
            "const": "observation-only"
          }
        }
      },
      "ApiError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "status",
              "code",
              "message",
              "retry_class",
              "correlation_id"
            ],
            "properties": {
              "status": {
                "type": "integer",
                "enum": [
                  400,
                  401,
                  403,
                  413,
                  415,
                  429,
                  503,
                  409
                ]
              },
              "code": {
                "type": "string",
                "enum": [
                  "invalid_request",
                  "authentication_denied",
                  "browser_boundary_denied",
                  "request_too_large",
                  "unsupported_media_type",
                  "capacity_or_rate_limited",
                  "authority_unavailable",
                  "permission_denied",
                  "command_conflict"
                ]
              },
              "message": {
                "type": "string",
                "enum": [
                  "Invalid request.",
                  "Authentication required or denied.",
                  "Browser request boundary refused.",
                  "Request exceeds its byte limit.",
                  "JSON content type required.",
                  "Request capacity or attempt limit reached.",
                  "Current authority or dependency unavailable.",
                  "This action is not permitted.",
                  "Command key or expected revision conflicts with current state."
                ]
              },
              "retry_class": {
                "type": "string",
                "enum": [
                  "authenticate",
                  "check_state",
                  "correct_request",
                  "retry_later"
                ]
              },
              "correlation_id": {
                "anyOf": [
                  {
                    "type": "string",
                    "pattern": "^[0-9a-f]{32}$",
                    "not": {
                      "const": "00000000000000000000000000000000"
                    }
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "oneOf": [
              {
                "properties": {
                  "status": {
                    "const": 400
